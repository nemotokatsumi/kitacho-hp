<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>北町町内会 お知らせ管理</title>
  <style>
    :root{--blue:#0068b7;--ink:#1e293b;--line:#cbd5e1;--bg:#f1f5f9}
    *{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink)}
    header{background:var(--blue);color:#fff;padding:18px 16px}.wrap{max-width:760px;margin:auto}.wrap h1{font-size:20px;margin:0}.user{font-size:12px;margin-top:6px;opacity:.9}
    main{padding:16px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}.card h2{font-size:17px;margin:0 0 14px}
    label{display:block;font-weight:bold;font-size:14px;margin-top:12px} input,select,textarea{width:100%;min-height:48px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:16px;background:#fff}textarea{min-height:84px;resize:vertical}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pdf{border:2px dashed var(--line);background:#f8fafc}.or{font-size:12px;color:#64748b;margin:8px 0}.hint{font-size:12px;color:#64748b;line-height:1.6;margin:8px 0}.analysis{min-height:24px;font-size:13px;margin:8px 0}.event-option{display:flex;align-items:center;gap:10px;padding:12px 0}.event-option input{width:20px;min-height:20px;accent-color:var(--blue)}
    button{min-height:48px;border:0;border-radius:8px;font-weight:bold;font-size:15px;cursor:pointer}.submit{width:100%;background:var(--blue);color:#fff;margin-top:16px}.submit:disabled{opacity:.55}
    .link-open{display:inline-flex;align-items:center;min-height:44px;font-size:14px;font-weight:bold;color:#075985}.link-open[hidden]{display:none}
    .message{min-height:24px;margin:10px 0;font-size:14px}.ok{color:#166534}.error{color:#b91c1c}
    .item{border-bottom:1px solid #e2e8f0;padding:14px 0}.item:last-child{border-bottom:0}.meta{font-size:12px;color:#64748b}.title{font-weight:bold;margin:6px 0}.actions{display:flex;gap:8px}.delete{background:#fee2e2;color:#991b1b;padding:0 14px}.view{background:#e0f2fe;color:#075985;padding:0 14px;text-decoration:none;display:inline-flex;align-items:center}
    @media(max-width:520px){.row{grid-template-columns:1fr}.card{padding:14px} main{padding:10px}}
  </style>
</head>
<body>
<header><div class="wrap"><h1>西川口 北町町内会</h1><div class="user">ログイン中：<?= userEmail ?></div></div></header>
<main class="wrap">
  <section class="card">
    <h2>お知らせを登録</h2>
    <label for="category">カテゴリ</label><select id="category"><option>防犯</option><option>衛生部</option><option>行事</option><option>防災</option><option>お知らせ</option><option>テスト</option></select>
    <label for="content">タイトル</label>
    <input id="content" type="text" maxlength="200" placeholder="例：3月 公園清掃のお知らせ" required>
    <label for="pdf">チラシ画像・PDF</label>
    <input id="pdf" class="pdf" type="file" accept="image/*,application/pdf">
    <p class="hint">選ぶとGeminiがタイトル・開催日・場所を読み取ります。画像は向きを自動で補正してPDFに変換し、Driveへ保存してリンク欄に自動で入ります。解析結果を確認してから登録してください。画像/PDFは解析のためGeminiへ送信されます（10MB以下）。</p>
    <div id="analysis-message" class="analysis" role="status"></div>
    <div class="row">
      <div><label for="date">開催日</label><input id="date" type="date" required></div>
      <div><label for="end-date">終了日（任意）</label><input id="end-date" type="date"></div>
    </div>
    <div class="row">
      <div><label for="start-time">開始時刻（任意）</label><input id="start-time" type="time"></div>
      <div><label for="end-time">終了時刻（任意）</label><input id="end-time" type="time"></div>
    </div>
    <div class="or">または、既存リンクを入力</div>
    <input id="link" type="url" placeholder="https://drive.google.com/...">
    <a id="link-open" class="link-open" href="#" target="_blank" rel="noopener noreferrer" hidden>リンクを別タブで開く</a>
    <label for="location">場所（任意）</label>
    <input id="location" type="text" maxlength="200" placeholder="例：北町公園">
    <label for="description">概要（任意）</label>
    <textarea id="description" maxlength="1000" placeholder="開催内容など"></textarea>
    <label class="event-option"><input id="add-to-calendar" type="checkbox" checked> 行事カレンダーにも登録</label>
    <button id="submit" class="submit" type="button">登録する</button>
    <div id="message" class="message"></div>
  </section>

  <section class="card">
    <h2>登録済みのお知らせ</h2>
    <div id="list">読み込み中...</div>
  </section>
</main>

<script>
  const dateInput=document.getElementById('date');
  dateInput.value=new Date().toLocaleDateString('sv-SE');
  let selectedFilePayload=null;
  let preparedPdf=null; // analyzeFlyerで保存済みのPDF {id,url}
  let analyzing=false;
  let analysisToken=0;
  const linkInput=document.getElementById('link');
  const submitButton=document.getElementById('submit');

  function setAnalyzing(value){analyzing=value;submitButton.disabled=value}

  // リンク欄にURLが入っていれば、その下に「別タブで開く」リンクを出す
  const linkOpen=document.getElementById('link-open');
  function updateLinkOpen(){
    const url=linkInput.value.trim();
    const ok=/^https?:\/\//i.test(url);
    linkOpen.hidden=!ok;
    linkOpen.href=ok?url:'#';
  }
  function setLink(value){linkInput.value=value;updateLinkOpen()}

  // 登録せずに差し替えた解析済みPDFを片付ける
  function discardPreparedPdf(){
    if(!preparedPdf)return;
    if(linkInput.value.trim()===preparedPdf.url)setLink('');
    google.script.run.withFailureHandler(()=>{}).discardFlyerPdf(preparedPdf.id);
    preparedPdf=null;
  }

  function escapeHtml(value){const d=document.createElement('div');d.textContent=value||'';return d.innerHTML}
  function showMessage(text,type){const el=document.getElementById('message');el.className='message '+type;el.textContent=text}

  function loadList(){
    document.getElementById('list').textContent='読み込み中...';
    google.script.run.withSuccessHandler(rows=>{
      const list=document.getElementById('list');
      if(!rows.length){list.textContent='登録されたお知らせはありません。';return}
      list.innerHTML=rows.map(row=>`
        <article class="item">
          <div class="meta">${escapeHtml(row.date)} ・ ${escapeHtml(row.category)}</div>
          <div class="title">${escapeHtml(row.content)}</div>
          <div class="actions">
            ${row.link?`<a class="view" href="${escapeHtml(row.link)}" target="_blank" rel="noopener noreferrer">添付・リンクを見る</a>`:''}
            <button class="delete" type="button" onclick="deleteItem(${row.rowIndex})">削除</button>
          </div>
        </article>`).join('');
    }).withFailureHandler(err=>document.getElementById('list').textContent=err.message||String(err)).listNews();
  }

  // スマホ写真の回転情報（EXIF）を反映した向きで描き直し、長辺を最大3000pxに縮小したJPEGにする。
  // 描き直すと回転情報に頼らない正しい向きの画像になる。ブラウザが読めない形式ならnullを返す。
  async function normalizeImage(file){
    let bitmap;
    try{bitmap=await createImageBitmap(file,{imageOrientation:'from-image'})}catch(e){return null}
    try{
      const scale=Math.min(1,3000/Math.max(bitmap.width,bitmap.height));
      const canvas=document.createElement('canvas');
      canvas.width=Math.round(bitmap.width*scale);
      canvas.height=Math.round(bitmap.height*scale);
      const ctx=canvas.getContext('2d');
      ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);
      const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',0.9));
      if(!blob)return null;
      return {blob,name:(file.name.replace(/\.[^/.]+$/,'')||'flyer')+'.jpg',mimeType:'image/jpeg'};
    }finally{bitmap.close()}
  }

  async function readFile(file){
    if(!file)return null;
    let mimeType=file.type||(file.name.toLowerCase().endsWith('.pdf')?'application/pdf':'image/jpeg');
    if(mimeType!=='application/pdf'&&!mimeType.startsWith('image/'))throw new Error('画像またはPDFを選択してください。');
    let blob=file,name=file.name;
    if(mimeType.startsWith('image/')){
      const normalized=await normalizeImage(file);
      if(normalized)({blob,name,mimeType}=normalized);
    }
    if(blob.size>10*1024*1024)throw new Error('ファイルは10MB以下にしてください。');
    return new Promise((resolve,reject)=>{
      const reader=new FileReader();
      reader.onload=()=>resolve({name,mimeType,data:String(reader.result).split(',')[1]});
      reader.onerror=()=>reject(new Error('ファイルを読み込めませんでした。'));
      reader.readAsDataURL(blob);
    });
  }

  async function analyzeSelectedFlyer(){
    const file=document.getElementById('pdf').files[0];
    const token=++analysisToken;
    discardPreparedPdf();
    const status=document.getElementById('analysis-message');
    if(!file){selectedFilePayload=null;status.textContent='';setAnalyzing(false);return}
    dateInput.value='';
    document.getElementById('end-date').value='';
    document.getElementById('start-time').value='';
    document.getElementById('end-time').value='';
    document.getElementById('content').value='';
    document.getElementById('location').value='';
    document.getElementById('description').value='';
    status.className='analysis';status.textContent='チラシを解析しています...';
    setAnalyzing(true);
    try{
      selectedFilePayload=await readFile(file);
      if(token!==analysisToken)return;
      google.script.run.withSuccessHandler(result=>{
        if(token!==analysisToken){
          // 解析中に別のファイルへ差し替えられた場合、古い結果は捨てる
          if(result.pdfFileId)google.script.run.withFailureHandler(()=>{}).discardFlyerPdf(result.pdfFileId);
          return;
        }
        setAnalyzing(false);
        if(result.pdfFileId){
          preparedPdf={id:result.pdfFileId,url:result.pdfUrl};
          setLink(result.pdfUrl);
        }
        if(result.title)document.getElementById('content').value=result.title;
        if(result.startDate)dateInput.value=result.startDate;
        if(result.endDate)document.getElementById('end-date').value=result.endDate;
        if(result.startTime)document.getElementById('start-time').value=result.startTime;
        if(result.endTime)document.getElementById('end-time').value=result.endTime;
        if(result.location)document.getElementById('location').value=result.location;
        if(result.description)document.getElementById('description').value=result.description;
        const category=document.getElementById('category');
        if(Array.from(category.options).some(option=>option.value===result.category))category.value=result.category;
        const notes=[];
        if(result.analysisError)notes.push('解析できませんでした（'+result.analysisError+'）。内容を手入力してください。');
        else notes.push(result.startDate?'解析しました。内容を確認・修正してください。':'タイトルを解析しましたが、開催日は読み取れませんでした。日付を入力してください。');
        if(result.pdfFileId)notes.push((result.rotation?'向きを補正（時計回りに'+result.rotation+'°回転）して、':'')+'PDF「'+result.pdfFileName+'」をDriveに保存し、リンク欄に入力しました。PDFの向きもご確認ください。');
        if(result.pdfError)notes.push(result.pdfError);
        status.className='analysis '+(result.analysisError?'error':'ok');
        status.textContent=notes.join(' ');
      }).withFailureHandler(error=>{
        if(token!==analysisToken)return;
        setAnalyzing(false);
        status.className='analysis error';status.textContent=error.message||String(error);
      }).analyzeFlyer(selectedFilePayload);
    }catch(error){
      if(token!==analysisToken)return;
      setAnalyzing(false);
      status.className='analysis error';status.textContent=error.message||String(error);
    }
  }

  async function register(){
    const button=submitButton;
    if(analyzing){showMessage('チラシの解析が終わるまでお待ちください。','error');return}
    button.disabled=true;
    showMessage('登録しています...','');
    try{
      const date=dateInput.value;
      const category=document.getElementById('category').value;
      const content=document.getElementById('content').value.trim();
      const link=document.getElementById('link').value.trim();
      if(!date||!category||!content) throw new Error('日付、カテゴリ、タイトルを入力してください。');
      // 解析時に保存したPDFがリンク欄にそのまま入っていれば、そのファイルを使い再アップロードしない
      const usePreparedPdf=!!preparedPdf&&link===preparedPdf.url;
      // PDF保存済みならリンク欄を書き換えた場合も元画像は送らない（二重保存防止）
      const file=preparedPdf?null:selectedFilePayload;
      const pdfFileId=usePreparedPdf?preparedPdf.id:'';
      const form={date,category,content,link,file,pdfFileId,endDate:document.getElementById('end-date').value,startTime:document.getElementById('start-time').value,endTime:document.getElementById('end-time').value,location:document.getElementById('location').value.trim(),description:document.getElementById('description').value.trim(),addToCalendar:document.getElementById('add-to-calendar').checked};
      google.script.run.withSuccessHandler(result=>{
        showMessage(result.calendarRegistered?'お知らせとカレンダーに登録しました。':'お知らせを登録しました。','ok');
        document.getElementById('content').value='';
        setLink('');
        document.getElementById('pdf').value='';
        document.getElementById('end-date').value='';
        document.getElementById('start-time').value='';
        document.getElementById('end-time').value='';
        document.getElementById('location').value='';
        document.getElementById('description').value='';
        document.getElementById('analysis-message').textContent='';
        selectedFilePayload=null;
        preparedPdf=null;
        button.disabled=false;
        loadList();
      }).withFailureHandler(err=>{
        showMessage(err.message||String(err),'error');
        button.disabled=false;
      }).registerNews(form);
    }catch(err){showMessage(err.message||String(err),'error');button.disabled=false}
  }

  function deleteItem(rowIndex){
    if(!confirm('このお知らせを削除しますか？'))return;
    google.script.run.withSuccessHandler(loadList).withFailureHandler(err=>alert(err.message||String(err))).deleteNews(rowIndex);
  }

  document.getElementById('pdf').addEventListener('change',analyzeSelectedFlyer);
  linkInput.addEventListener('input',updateLinkOpen);
  document.getElementById('submit').addEventListener('click',register);
  loadList();
</script>
</body>
</html>
