<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>西川口 北町町内会 公式サイト</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap');
        body { font-family: 'Noto Sans JP', sans-serif; }
        .bg-kitacho { background-color: #0068b7; }
        .hero-section {
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://images.unsplash.com/photo-1570129477492-45c003edd2be?auto=format&fit=crop&q=80&w=1200');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <nav class="bg-white shadow-sm sticky top-0 z-50 border-b-2 border-blue-600">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">🏘️</span>
                <h1 class="text-xl font-bold text-blue-800">西川口 北町町内会</h1>
            </div>
            <div class="hidden md:flex space-x-8 font-bold text-gray-600">
                <a href="#news" class="hover:text-blue-600">お知らせ</a>
                <a href="#calendar" class="hover:text-blue-600 text-red-600">防災情報</a>
                <a href="#join" class="hover:text-blue-600">入会案内</a>
            </div>
        </div>
    </nav>

    <header class="hero-section h-[300px] flex items-center justify-center text-center text-white">
        <div class="px-4">
            <h2 class="text-3xl md:text-5xl font-bold mb-4 drop-shadow-lg">人と人がつながる、安心な北町</h2>
            <p class="text-lg md:text-xl font-medium drop-shadow-md">埼玉県川口市 西川口北町町内会</p>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-12 space-y-16">

        <section id="news">
            <div class="flex items-center justify-between mb-6 border-b-2 border-gray-200 pb-2">
                <h3 class="text-2xl font-bold text-gray-800">新着情報</h3>
                <span class="text-xs text-gray-500">※スプレッドシートから自動更新中</span>
            </div>
            
            <div id="news-list" class="space-y-4">
                <p class="text-center py-10 text-gray-500">お知らせを読み込み中...</p>
            </div>
        </section>

        <section id="safety" class="bg-red-50 p-6 rounded-2xl border-2 border-red-100">
            <h3 class="text-2xl font-bold text-red-700 mb-6 flex items-center">
                <span class="mr-2">⚠️</span> 防災・緊急連絡先
            </h3>
            <div class="grid md:grid-cols-2 gap-8">
                <div class="bg-white p-6 rounded-xl shadow-sm">
                    <h4 class="font-bold text-lg mb-3 text-gray-700">指定避難所</h4>
                    <p class="text-xl font-bold text-blue-800 mb-2">川口市立並木小学校</p>
                    <p class="text-sm text-gray-600">川口市並木2-8-1</p>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm flex items-center justify-center">
                    <a href="https://www.city.kawaguchi.lg.jp/soshiki/01040/010/3/21793.html" target="_blank" class="w-full text-center bg-gray-700 text-white py-3 rounded font-bold hover:bg-gray-800 transition">川口市ハザードマップ確認</a>
                </div>
            </div>
        </section>

    </main>

    <footer class="bg-blue-900 text-white py-12 mt-12 text-center">
        <p class="text-xl font-bold mb-2">西川口 北町町内会</p>
        <p class="text-blue-300 text-xs">&copy; 2026 西川口 北町町内会</p>
    </footer>

    <script>
        const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ8qqCO0DH94_iS0cY25eapiPsFlIADdbAhY7BXkqMlzBKhfrlOd2G6gpFwfLIZlzkZhOzS2DkYBggv/pub?gid=0&single=true&output=csv";

        async function fetchNews() {
            try {
                const response = await fetch(csvUrl);
                const data = await response.text();
                const rows = data.split('\n').slice(1); // 1行目（ヘッダー）を飛ばす
                
                const newsList = document.getElementById('news-list');
                newsList.innerHTML = ''; // 読み込み中テキストを消去

                rows.forEach(row => {
                    // CSVの各行をカンマで分割
                    const cols = row.split(',');
                    if (cols.length >= 3) {
                        const date = cols[0];     // 日付
                        const category = cols[1]; // カテゴリ
                        const content = cols[2];  // 内容

                        // HTML要素を作成
                        const item = document.createElement('div');
                        item.className = "bg-white p-4 rounded-lg shadow-sm border-l-4 border-blue-500 flex justify-between items-center";
                        item.innerHTML = `
                            <div>
                                <span class="text-sm text-gray-500">${date}</span>
                                <p class="font-bold text-gray-800">${content}</p>
                            </div>
                            <span class="bg-blue-100 text-blue-700 text-xs px-2 py-1 rounded">${category}</span>
                        `;
                        newsList.appendChild(item);
                    }
                });
            } catch (error) {
                console.error("読み込みエラー:", error);
                document.getElementById('news-list').innerHTML = '<p class="text-red-500">お知らせの読み込みに失敗しました。</p>';
            }
        }

        // ページ読み込み時に実行
        fetchNews();
    </script>
</body>
</html>
